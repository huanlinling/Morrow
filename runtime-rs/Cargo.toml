[package]
name = "ferrum-runtime"
version = "0.1.0"
edition = "2021"
description = "Ferrum Runtime Core — Rust cdylib for Minecraft native modding"

[lib]
crate-type = ["cdylib"]

[dependencies]
zip = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
libloading = "0.8"
tempfile = "3"
