[package]
name = "morrow-runtime"
version = "1.0.0"
edition = "2021"
description = "Morrow Runtime Core — Rust cdylib for Minecraft native modding"

[lib]
# rlib so integration tests (tests/mod_loader_integration.rs) can link
# against the crate; cdylib is what ships in the runtime image.
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
libloading = "0.8"
log = "0.4"
tempfile = "3"

[dev-dependencies]
# The integration test (tests/mod_loader_integration.rs) packages the
# fixture cdylib into a .morrow zip and loads it through the real loader.
zip = "2"
tempfile = "3"
testmod = { path = "tests/fixtures/testmod" }
