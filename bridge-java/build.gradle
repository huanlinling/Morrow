plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ─── Dependencies ────────────────────────────

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // No Fabric API — Morrow uses Mixin hooks directly
    // modImplementation "net.fabricmc.fabric-api:..."
}

// ─── Native Library (Rust runtime) ─────────────

// Path to the compiled native runtime (relative to bridge-java/)
def nativeLibDir = file("${rootDir}/../target/release")

// Copy the native library into run directories so NativeLibraryLoader can find it
task copyNativeLib(type: Copy) {
    from nativeLibDir
    include '*.so', '*.dll', '*.dylib'
    into file("${buildDir}/natives")
}

// Ensure native lib is built before running
tasks.processResources {
    dependsOn ':copyNativeLib'

    // Expand ${version} in fabric.mod.json
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand project.properties
    }

    // Copy .so into the JAR for production packaging
    from(nativeLibDir) {
        include '*.so'
        into 'natives/linux-x86_64'
    }
    from(nativeLibDir) {
        include '*.dll'
        into 'natives/windows-x86_64'
    }
}

// ─── Run configurations ────────────────────────

loom {
    runs {
        server {
            server()
            // Tell NativeLibraryLoader where to find the .so
            vmArg "-Dmorrow.native.dir=${nativeLibDir.absolutePath}"
            vmArg '--enable-preview'
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
    }
}

// Our source layout already matches Gradle conventions
sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
}

// ─── Tasks ─────────────────────────────────────

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
    options.release = 21
}
