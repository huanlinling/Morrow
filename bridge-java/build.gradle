// ASM for generating the compile-time MinecraftServer stub (below).
buildscript {
    dependencies { classpath 'org.ow2.asm:asm:9.7.1' }
}

plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

// ── Standalone agent packaging ──────────────────────────────────────────
// The production entry is `java -javaagent:morrow.jar -jar server.jar`
// with no Fabric Loader. The agent classloader only sees the top level
// of the agent jar, so Mixin + ASM must be MERGED in (loom's `include`
// nests jars, which would not load). Guava and Gson are deliberately
// excluded — the vanilla server jar provides both (bundling would put
// duplicate classes on the app classpath).
configurations {
    agent
}

dependencies {
    agent("net.fabricmc:sponge-mixin:${project.mixin_version}") {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
}

// Mixin 0.8.5 ships with ASM 9.2, which cannot parse class files newer
// than Java 19. Our classes target Java 21 (major 65), so force the ASM
// bundled in the agent jar up to a version that handles them.
configurations.agent {
    resolutionStrategy.force 'org.ow2.asm:asm:9.7.1',
            'org.ow2.asm:asm-tree:9.7.1',
            'org.ow2.asm:asm-commons:9.7.1',
            'org.ow2.asm:asm-util:9.7.1',
            'org.ow2.asm:asm-analysis:9.7.1'
}

// The vanilla-agent mixin + host adapter (obfuscated target names) cannot
// go through loom's mixin annotation processor — it has no dev-mappings
// entry for names like "n_()V" and fails the build. Compiled separately
// without annotation processing; the classes land in the agent jar only.
// The obfuscated game classes (alk, sw, ...) are compiled as source stubs
// (src/vanilla/stubs); the MinecraftServer stub is generated by ASM (its
// methods return default-package types, which javac forbids a named
// package from referencing). All stubs are compile-time only and excluded
// from the agent jar — the real game jar wins at runtime because the game
// loader's own URLs precede the appended agent jar.
def vanillaStubs = tasks.register('compileVanillaStubs', JavaCompile) {
    source = files('src/vanilla/stubs')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('vanilla-stubs-src')
    options.release = 21
}

def vanillaStubOut = layout.buildDirectory.dir('vanilla-stubs')

def vanillaStubGen = tasks.register('generateVanillaStub') {
    def outDir = vanillaStubOut
    inputs.property 'mappingVersion', '1.20.1'
    outputs.dir(outDir)
    doLast {
        def file = outDir.get().file('net/minecraft/server/MinecraftServer.class').asFile
        file.parentFile.mkdirs()
        def cw = new org.objectweb.asm.ClassWriter(0)
        cw.visit(org.objectweb.asm.Opcodes.V17, org.objectweb.asm.Opcodes.ACC_PUBLIC,
                'net/minecraft/server/MinecraftServer', null, 'java/lang/Object', null)
        def stub = { String name, String desc ->
            def mw = cw.visitMethod(org.objectweb.asm.Opcodes.ACC_PUBLIC, name, desc, null, null)
            mw.visitCode(); mw.visitInsn(org.objectweb.asm.Opcodes.ACONST_NULL)
            mw.visitInsn(org.objectweb.asm.Opcodes.ARETURN); mw.visitMaxs(1, 1); mw.visitEnd()
        }
        // Descriptors match the real 1.20.1 jar exactly (javap-verified).
        stub('ac', '()Lalk;')           // getPlayerList -> PlayerList
        stub('aC', '()Ldt;')            // getCommands
        stub('aD', '()Lds;')            // createCommandSourceStack
        stub('a', '(Lacp;)Laif;')       // getLevel(ResourceKey) -> ServerLevel
        cw.visitEnd()
        file.bytes = cw.toByteArray()
    }
}

def vanillaMixin = tasks.register('compileVanillaMixin', JavaCompile) {
    dependsOn vanillaStubs, vanillaStubGen
    // ServerApiVanilla compiles separately at 21 (FFM preview API — see
    // compileServerApiVanilla below).
    source = fileTree('src/vanilla/java') { exclude 'ServerApiVanilla.java' }
    // NOTE: sourceSets.main.compileClasspath must NOT be here — it carries
    // loom's yarn-mapped minecraft.jar whose MinecraftServer (yarn names)
    // would shadow the ASM stub (obfuscated names) for javac.
    // main.output is deliberately absent too: it is compiled at 21 with
    // preview flags, which javac at release 17 refuses to read. The
    // stubs in src/vanilla/stubs (MorrowMod, ServerApi, ChildFirstLoader)
    // cover the main-set types the mixins reference.
    classpath = files(configurations.agent,
            vanillaStubs.map { it.destinationDirectory },
            vanillaStubOut)
    destinationDirectory = layout.buildDirectory.dir('vanilla-mixin')
    options.compilerArgs += ['-proc:none']
    // Class version must match the config's compatibilityLevel (JAVA_17):
    // mixin 0.8.5's CompatibilityLevel enum tops out at JAVA_18, so a
    // release-21 class (major 65) exceeds the declared level and warns at
    // startup. These classes use no Java 21 features.
    options.release = 17
    // No debug info: javac's LVT would type the `this` rows with the
    // default-package mixin name, and Mixin's LVT transformer then asks
    // getClassNode() for a name that no longer exists after relocation.
    // Without LVT the injected code simply carries no debug mapping.
    options.debug = false
}

// ServerApiVanilla talks to native memory via the FFM preview API —
// it must stay at release 21 with preview flags (from the global
// JavaCompile configuration below).
def serverApiVanilla = tasks.register('compileServerApiVanilla', JavaCompile) {
    dependsOn tasks.named('compileJava')
    dependsOn vanillaStubs, vanillaStubGen
    source = files('src/vanilla/java/ServerApiVanilla.java')
    classpath = files(sourceSets.main.output, configurations.agent,
            vanillaStubs.map { it.destinationDirectory },
            vanillaStubOut)
    destinationDirectory = layout.buildDirectory.dir('vanilla-sapi')
}

// The vanilla event mixins are authored in the DEFAULT package (javac
// forbids named packages from referencing the obfuscated default-package
// game classes) — but Mixin refuses configs without a package. Relocate
// just the mixin classes into com.morrow.mixin post-compile; their
// signatures still reference the default-package game types, which is
// what the runtime sees. ServerApiVanilla stays default-package
// (ChildFirstLoader finds it by that name).
def relocateVanillaMixins = tasks.register('relocateVanillaMixins') {
    dependsOn vanillaMixin, serverApiVanilla
    def srcDir = layout.buildDirectory.dir('vanilla-mixin')
    def sapiDir = layout.buildDirectory.dir('vanilla-sapi')
    def outDir = layout.buildDirectory.dir('vanilla-mixin-pkg')
    inputs.dir(srcDir)
    inputs.dir(sapiDir)
    outputs.dir(outDir)
    def relocated = ['MorrowPlayerListMixinVanilla', 'MorrowChatMixinVanilla',
                     'MorrowGameModeMixinVanilla', 'MorrowDeathMixinVanilla',
                     'MorrowPlaceSelfTestMixin'] as Set
    doLast {
        def dir = srcDir.get().asFile
        dir.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def bytes = f.bytes
            def cls = f.name - '.class'
            if (cls in relocated) {
                // Constant-pool surgery: every CP Class entry pointing at
                // the default-package name (this_class, invokestatic owners
                // of private helpers, LVT rows) is re-pointed at the Utf8
                // of the relocated name — which javac already emitted for
                // this_class. Pure index patching, no length changes; all
                // other type references stay default-package, matching the
                // real game classes at runtime.
                def newName = 'com/morrow/mixin/' + cls
                def count = ((bytes[8] & 0xFF) << 8) | (bytes[9] & 0xFF)
                def entryStart = [:] as Map<Integer,Integer>
                def tagAt = [:] as Map<Integer,Integer>
                def utf8Idx = [:] as Map<Integer,String>
                int off = 10
                for (int i = 1; i < count; i++) {
                    entryStart[i] = off
                    int tag = bytes[off] & 0xFF
                    tagAt[i] = tag
                    switch (tag) {
                        case 1:
                            int len = ((bytes[off+1] & 0xFF) << 8) | (bytes[off+2] & 0xFF)
                            utf8Idx[i] = new String(bytes, off+3, len, 'UTF-8')
                            off += 3 + len
                            break
                        case 3: case 4: off += 5; break
                        case 5: case 6: off += 9; i++; break
                        case 7: case 8: case 16: case 19: case 20: off += 3; break
                        case 9: case 10: case 11: case 12: case 17: case 18: off += 5; break
                        case 15: off += 4; break
                        default: throw new RuntimeException("unexpected CP tag $tag in $cls")
                    }
                }
                // The new name appears nowhere in the pool yet — append a
                // Utf8 entry at the end (nothing references absolute CP
                // offsets, only indexes) and bump constant_pool_count.
                def newBytes = new byte[bytes.length + 3 + newName.length()]
                System.arraycopy(bytes, 0, newBytes, 0, off)
                newBytes[off] = 1
                newBytes[off+1] = (byte) (newName.length() >> 8)
                newBytes[off+2] = (byte) (newName.length() & 0xFF)
                System.arraycopy(newName.getBytes('UTF-8'), 0, newBytes, off+3, newName.length())
                System.arraycopy(bytes, off, newBytes, off + 3 + newName.length(), bytes.length - off)
                int newIdx = count
                newBytes[8] = (byte) ((count + 1) >> 8)
                newBytes[9] = (byte) ((count + 1) & 0xFF)
                bytes = newBytes
                tagAt.each { idx, tag ->
                    if (tag == 7) {
                        int nameIdx = ((bytes[entryStart[idx]+1] & 0xFF) << 8) | (bytes[entryStart[idx]+2] & 0xFF)
                        if (utf8Idx[nameIdx] == cls) {
                            bytes[entryStart[idx]+1] = (byte) (newIdx >> 8)
                            bytes[entryStart[idx]+2] = (byte) (newIdx & 0xFF)
                        }
                    }
                }
                def out = new File(outDir.get().asFile, 'com/morrow/mixin/' + cls + '.class')
                out.parentFile.mkdirs()
                out.bytes = bytes
            } else {
                def rel = dir.toPath().relativize(f.toPath()).toString()
                def out = new File(outDir.get().asFile, rel)
                out.parentFile.mkdirs()
                out.bytes = bytes
            }
        }
        // ServerApiVanilla (compiled at 21 for FFM) passes through
        // unchanged — it is not a mixin, no relocation needed.
        sapiDir.get().asFile.eachFile { f ->
            def out = new File(outDir.get().asFile, f.name)
            out.bytes = f.bytes
        }
    }
}

tasks.register('agentJar', Jar) {
    dependsOn tasks.named('jar')
    dependsOn relocateVanillaMixins
    // Forge-style name: the obfuscated mixin names are pinned to one
    // Minecraft version (1.20.1), so the artifact name says which.
    // morrow-host-1.20.1-1.0.0-agent.jar
    archiveFileName = "morrow-host-${project.minecraft_version}-${project.version}-agent.jar"
    // Agent-only resources FIRST so they win duplicate resolution:
    // the service entries claiming the vanilla host role, the property
    // service, and the agent mixins.json listing the obfuscated-name
    // mixin (MinecraftServerMixinVanilla). The mixin annotation processor
    // rewrites the dev jar's mixins.json (adds its refmap) and generates
    // its own refmap files — all three are dev-only and dropped here.
    from('src/main/resources-agent')
    from(relocateVanillaMixins.map { it.outputs.files })
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'morrow.mixins.json', 'morrow-refmap.json', 'morrow-host-refmap.json'
    }
    from(configurations.agent.collect { zipTree(it) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
            'Premain-Class': 'com.morrow.agent.MorrowAgent',
            'Agent-Class': 'com.morrow.agent.MorrowAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.named('build') {
    dependsOn tasks.named('agentJar')
}

group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // Loom provides remapped Minecraft for compilation only
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // Fabric Loader — dev runtime only (Loom runServer).
    // Production: java -javaagent:morrow.jar (Mixin via Agent, no Fabric)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // ASM for the agent service classes (MixinServiceVanilla).
    // Mixin API itself arrives transitively via fabric-loader; pin the
    // compile classpath to the same mixin version the agent jar bundles
    // (0.8.5) so signatures match — dev runtime keeps the loader's own.
    configurations.compileClasspath {
        resolutionStrategy.force "net.fabricmc:sponge-mixin:${project.mixin_version}"
    }
    compileOnly "org.ow2.asm:asm:9.2"
    compileOnly "org.ow2.asm:asm-tree:9.2"
}

def nativeLibDir = file("${rootDir}/../target/release")

tasks.processResources {
    // 替换 fabric.mod.json 里的 ${version} 占位符
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    from(nativeLibDir) {
        include '*.so'
        into 'natives/linux-x86_64'
    }
    from(nativeLibDir) {
        include '*.dll'
        into 'natives/windows-x86_64'
    }
}

loom {
    runs {
        server {
            server()
            vmArg "-Dmorrow.native.dir=${nativeLibDir.absolutePath}"
            vmArg '--enable-preview'
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
    }
}

// Agent JAR manifest
tasks.jar {
    manifest {
        attributes(
            'Premain-Class': 'com.morrow.agent.MorrowAgent',
            'Agent-Class': 'com.morrow.agent.MorrowAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
}

sourceSets {
    main { java.srcDirs = ['src/main/java']; resources.srcDirs = ['src/main/resources'] }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
    options.release = 21
}

// Registered after the configureEach above, so it wins: the vanilla
// mixins must compile at 17 (see compileVanillaMixin — matches the
// config's JAVA_17 compatibility level; 0.8.5's enum has no JAVA_21).
// Preview features require release 21, so drop the flag as well.
tasks.named('compileVanillaMixin') {
    options.release = 17
    options.compilerArgs -= ['--enable-preview']
}
