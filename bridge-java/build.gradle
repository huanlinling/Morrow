plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

// ── Standalone agent packaging ──────────────────────────────────────────
// The production entry is `java -javaagent:morrow.jar -jar server.jar`
// with no Fabric Loader. The agent classloader only sees the top level
// of the agent jar, so Mixin + ASM must be MERGED in (loom's `include`
// nests jars, which would not load). Guava and Gson are deliberately
// excluded — the vanilla server jar provides both (bundling would put
// duplicate classes on the app classpath).
configurations {
    agent
}

dependencies {
    agent("net.fabricmc:sponge-mixin:${project.mixin_version}") {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
}

// Mixin 0.8.5 ships with ASM 9.2, which cannot parse class files newer
// than Java 19. Our classes target Java 21 (major 65), so force the ASM
// bundled in the agent jar up to a version that handles them.
configurations.agent {
    resolutionStrategy.force 'org.ow2.asm:asm:9.7.1',
            'org.ow2.asm:asm-tree:9.7.1',
            'org.ow2.asm:asm-commons:9.7.1',
            'org.ow2.asm:asm-util:9.7.1',
            'org.ow2.asm:asm-analysis:9.7.1'
}

tasks.register('agentJar', Jar) {
    dependsOn tasks.named('jar')
    archiveClassifier = 'agent'
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile }))
    // Agent-only resources: the vanilla IGlobalPropertyService entry must
    // NOT ship in the plain mods/ jar, where Fabric's own store wins.
    from('src/main/resources-agent')
    from(configurations.agent.collect { zipTree(it) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
            'Premain-Class': 'com.morrow.agent.MorrowAgent',
            'Agent-Class': 'com.morrow.agent.MorrowAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.named('build') {
    dependsOn tasks.named('agentJar')
}

group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // Loom provides remapped Minecraft for compilation only
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // Fabric Loader — dev runtime only (Loom runServer).
    // Production: java -javaagent:morrow.jar (Mixin via Agent, no Fabric)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // ASM for the agent service classes (MixinServiceVanilla).
    // Mixin API itself arrives transitively via fabric-loader; pin the
    // compile classpath to the same mixin version the agent jar bundles
    // (0.8.5) so signatures match — dev runtime keeps the loader's own.
    configurations.compileClasspath {
        resolutionStrategy.force "net.fabricmc:sponge-mixin:${project.mixin_version}"
    }
    compileOnly "org.ow2.asm:asm:9.2"
    compileOnly "org.ow2.asm:asm-tree:9.2"
}

def nativeLibDir = file("${rootDir}/../target/release")

tasks.processResources {
    // 替换 fabric.mod.json 里的 ${version} 占位符
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    from(nativeLibDir) {
        include '*.so'
        into 'natives/linux-x86_64'
    }
    from(nativeLibDir) {
        include '*.dll'
        into 'natives/windows-x86_64'
    }
}

loom {
    runs {
        server {
            server()
            vmArg "-Dmorrow.native.dir=${nativeLibDir.absolutePath}"
            vmArg '--enable-preview'
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
    }
}

// Agent JAR manifest
tasks.jar {
    manifest {
        attributes(
            'Premain-Class': 'com.morrow.agent.MorrowAgent',
            'Agent-Class': 'com.morrow.agent.MorrowAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
}

sourceSets {
    main { java.srcDirs = ['src/main/java']; resources.srcDirs = ['src/main/resources'] }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
    options.release = 21
}
