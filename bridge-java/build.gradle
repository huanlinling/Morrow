plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

repositories {
    mavenCentral()
}

group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    // Fabric Loader — only for Loom runServer in dev
    // Production: java -javaagent:morrow.jar (Agent premain bootstraps Mixin)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

def nativeLibDir = file("${rootDir}/../target/release")

tasks.processResources {
    from(nativeLibDir) {
        include '*.so'
        into 'natives/linux-x86_64'
    }
    from(nativeLibDir) {
        include '*.dll'
        into 'natives/windows-x86_64'
    }
}

// Agent JAR (thin — deps on classpath via Loom in dev)
tasks.jar {
    manifest {
        attributes(
            'Premain-Class': 'com.morrow.agent.MorrowAgent',
            'Agent-Class': 'com.morrow.agent.MorrowAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        )
    }
}

loom {
    runs {
        server {
            server()
            vmArg "-Dmorrow.native.dir=${nativeLibDir.absolutePath}"
            vmArg '--enable-preview'
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
    options.release = 21
}
