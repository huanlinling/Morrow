name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rust build + unit tests
        run: |
          cargo build --release
          cargo test --release

      - name: rustdoc (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Package example mods
        run: |
          bash scripts/package-mod.sh examples/hello-morrow
          bash scripts/package-mod.sh examples/chat-bot
          bash scripts/package-mod.sh examples/motd

      - name: Gradle build (bridge-java, embeds .so)
        working-directory: bridge-java
        run: ./gradlew --no-daemon build

      - name: Full bridge suite (M0/M1, parity, benchmarks, agent smoke)
        working-directory: bridge-java
        run: bash build.sh

      - name: Verify exported ABI symbols
        run: |
          nm -D target/release/libmorrow_runtime.so | grep -E ' morrow_(init|shutdown|load_mod|dispatch_batch|register_host_api)$'
          nm -D target/release/libhello_morrow.so | grep -c 'morrow_mod_' | grep -q '10' \
            && echo "hello-morrow exports all 9 event kinds + init"
          nm -D target/release/libtestmod.so | grep -c 'morrow_mod_' | grep -q '10' \
            && echo "testmod fixture exports its 9 event kinds + init"
